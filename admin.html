<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة المنيو | بُنان كوفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=category-edit-20261007">
</head>
<body>
<header class="admin-header">
  <a class="admin-brand" href="index.html" aria-label="العودة إلى المنيو">
    <img src="images/logo.png" alt="">
    <span lang="en">BUNNAN</span>
  </a>
  <div class="admin-heading">
    <h1>إدارة المنيو</h1>
    <p>كوفي بنان</p>
  </div>
  <div class="header-actions">
    <a class="button button-secondary" href="index.html">عرض الموقع</a>
    <button class="button button-secondary" id="sign-out" type="button" hidden>تسجيل الخروج</button>
  </div>
</header>

<main class="admin-main">
  <div class="notice" id="setup-notice">
    يلزم إعداد Supabase مرة واحدة قبل استخدام لوحة الإدارة: أنشئي الجداول من ملف <code>supabase-schema.sql</code>، ثم ضعي رابط المشروع والمفتاح العام في <code>supabase-config.js</code>.
  </div>

  <section class="auth-panel" id="login-panel" hidden aria-labelledby="login-title">
    <h2 id="login-title">دخول صاحب الكوفي</h2>
    <form id="login-form" class="login-form">
      <div class="field">
        <label for="login-username">اسم المستخدم</label>
        <input id="login-username" type="text" autocomplete="username" value="bunnan-admin" required>
      </div>
      <div class="field">
        <label for="login-password">كلمة المرور</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="button button-primary" type="submit">دخول</button>
    </form>
  </section>

  <section id="manager" hidden>
    <div class="admin-shell">
      <section class="inventory" aria-labelledby="inventory-title">
        <header class="panel-header">
          <h2 id="inventory-title">الأصناف <span class="item-count" id="item-count">0</span></h2>
          <button class="button button-primary" id="new-item" type="button">إضافة صنف</button>
        </header>
        <details class="category-manager">
          <summary>إدارة الأقسام</summary>
          <form class="category-form" id="category-form">
            <label class="field">
              <span>اسم القسم بالعربي</span>
              <input id="category-name" type="text" maxlength="80" required>
            </label>
            <label class="field">
              <span>اسم القسم بالإنجليزي</span>
              <input id="category-en" type="text" lang="en" dir="ltr" maxlength="80" required>
            </label>
            <button class="button button-primary" type="submit">إضافة القسم</button>
            <button class="button button-secondary" id="cancel-category-edit" type="button" hidden>إلغاء التعديل</button>
          </form>
          <ul class="category-list" id="category-list" aria-label="الأقسام الحالية"></ul>
        </details>
        <div class="inventory-tools">
          <input class="field-control" id="item-search" type="search" placeholder="ابحث عن صنف" aria-label="ابحث عن صنف">
          <select class="field-control" id="category-filter" aria-label="تصفية حسب القسم"></select>
        </div>
        <div class="inventory-list" id="item-list"></div>
      </section>

      <section class="editor" aria-labelledby="form-title">
        <header class="editor-header">
          <h2 id="form-title">إضافة صنف</h2>
        </header>
        <form class="menu-form" id="menu-form">
          <div class="field">
            <label for="item-name">اسم الصنف</label>
            <input id="item-name" type="text" required>
          </div>
          <div class="field">
            <label for="item-en">الاسم بالإنجليزية</label>
            <input id="item-en" type="text" lang="en" dir="ltr" required>
          </div>
          <div class="field">
            <label for="item-category">القسم</label>
            <select id="item-category" required></select>
          </div>
          <div class="field">
            <label for="item-price">السعر (د.إ)</label>
            <input id="item-price" type="number" min="0" step="0.5" required>
          </div>
          <div class="field full">
            <label for="item-description">الوصف</label>
            <textarea id="item-description" rows="4"></textarea>
          </div>
          <div class="field full">
            <label for="item-image">رابط الصورة</label>
            <div class="image-controls">
              <input class="field-control" id="item-image" type="text" dir="ltr" placeholder="images/item.jpg">
              <label class="file-picker">اختيار صورة
                <input id="item-image-file" type="file" accept="image/*" aria-label="رفع صورة جديدة">
              </label>
            </div>
          </div>
          <div class="field full">
            <div class="image-preview-wrap">
              <img class="image-preview" id="image-preview" alt="معاينة صورة الصنف" hidden>
              <span class="image-empty" id="image-empty">معاينة الصورة</span>
            </div>
          </div>
          <label class="checkbox-line field full">
            <input id="item-available" type="checkbox" checked>
            <span>متوفر في المنيو</span>
          </label>
          <div class="form-actions field full">
            <button class="button button-primary" type="submit">حفظ التغييرات</button>
            <button class="button button-secondary" id="cancel-edit" type="button">إلغاء</button>
            <span class="spacer"></span>
            <button class="button button-danger" id="delete-current" type="button" hidden>حذف الصنف</button>
          </div>
        </form>
      </section>
    </div>
  </section>
</main>
<div class="admin-status" id="admin-status" role="status" aria-live="polite"></div>
<script src="menu.js?v=hot-drinks-category-20261007"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js?v=hot-drinks-category-20261007"></script>
</body>
</html>
